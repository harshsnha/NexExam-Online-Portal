<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexExam - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #38bdf8;
            --accent2: #7c3aed;
            --accent3: #818cf8;
            --bg: #050b18;
            --glass: rgba(5, 14, 32, 0.65);
            --border: rgba(56, 189, 248, 0.18);
            --text: #f1f5f9;
            --muted: #334155;
            --dimmed: #1e3a5f;
            --input-bg: rgba(255,255,255,.03);
            --input-border: rgba(255,255,255,.07);
            --input-placeholder: #1e293b;
        }

        [data-bs-theme="light"] {
            --accent: #0891b2;
            --accent2: #7c3aed;
            --accent3: #6366f1;
            --bg: #eef2fa;
            --glass: rgba(255, 255, 255, 0.72);
            --border: rgba(8, 145, 178, 0.2);
            --text: #0b1220;
            --muted: #64748b;
            --dimmed: #94a3b8;
            --input-bg: rgba(11,18,32,.035);
            --input-border: rgba(11,18,32,.09);
            --input-placeholder: #a8b3c4;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            transition: background .4s ease;
        }

        /* ── Three.js canvas fills entire viewport ── */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            display: block;
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            position: fixed;
            top: 24px; right: 24px;
            z-index: 20;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            cursor: pointer;
            transition: transform .25s, box-shadow .25s, background .4s, border-color .4s;
            animation: fadeUp .6s .15s both;
        }
        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(56,189,248,.25);
        }
        .theme-toggle svg { width: 19px; height: 19px; }

        /* ── Center overlay ── */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Glass panel ── */
        .panel {
            width: 390px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 40px 36px 34px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: panelIn .9s cubic-bezier(.22,1,.36,1) both;
            transition: background .4s ease, border-color .4s ease;
        }

        @keyframes panelIn {
            from { opacity: 0; transform: translateY(36px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* shimmer top line */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56,189,248,.9), transparent);
        }

        /* mouse spotlight */
        .panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: radial-gradient(380px circle at var(--mx,50%) var(--my,30%), rgba(56,189,248,.06), transparent 60%);
            pointer-events: none;
        }

        /* ── Brand ── */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            animation: fadeUp .6s .2s both;
        }

        .brand-icon {
            width: 44px; height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 22px rgba(56,189,248,.5), 0 0 50px rgba(56,189,248,.15);
            position: relative;
        }

        .brand-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            z-index: -1;
            filter: blur(10px);
            opacity: .4;
        }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text);
            letter-spacing: -.4px;
            line-height: 1;
        }

        .brand-name span {
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tag {
            font-size: .58rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 3px;
        }

        /* ── Headings ── */
        .login-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--text);
            letter-spacing: -.3px;
            margin-bottom: 4px;
            animation: fadeUp .6s .3s both;
        }

        .login-sub {
            color: var(--muted);
            font-size: .82rem;
            margin-bottom: 24px;
            animation: fadeUp .6s .35s both;
        }

        /* ── Alerts ── */
        .alert-box {
            border-radius: 11px;
            padding: 11px 14px;
            font-size: .82rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .alert-error {
            background: rgba(239,68,68,.09);
            border: 1px solid rgba(239,68,68,.22);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34,197,94,.09);
            border: 1px solid rgba(34,197,94,.22);
            color: #86efac;
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 15px;
            animation: fadeUp .6s both;
        }

        .form-group:nth-of-type(1) { animation-delay: .4s; }
        .form-group:nth-of-type(2) { animation-delay: .45s; }

        .form-label {
            display: block;
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dimmed);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            pointer-events: none;
            transition: color .2s;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 11px;
            padding: 12px 12px 12px 38px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: .88rem;
            outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
        }

        .form-input::placeholder { color: var(--input-placeholder); }

        .form-input:focus {
            border-color: rgba(56,189,248,.55);
            background: rgba(56,189,248,.04);
            box-shadow: 0 0 0 3px rgba(56,189,248,.13);
        }

        .input-wrap:focus-within .input-icon { color: var(--accent); }

        .eye-btn {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--dimmed);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            transition: color .2s;
        }

        .eye-btn:hover { color: var(--accent); }

        /* ── Submit button ── */
        .btn-login {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8 50%, #7dd3fc);
            background-size: 200% 100%;
            background-position: 100% 0;
            color: #050b18;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: .88rem;
            letter-spacing: .6px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-position .4s, box-shadow .3s, transform .15s;
            box-shadow: 0 0 20px rgba(56,189,248,.35), 0 4px 12px rgba(56,189,248,.2);
            animation: fadeUp .6s .5s both;
        }

        .btn-login .shine {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
            transition: left .5s;
        }

        .btn-login:hover .shine { left: 100%; }

        .btn-login:hover {
            background-position: 0% 0;
            box-shadow: 0 0 36px rgba(56,189,248,.6), 0 6px 20px rgba(56,189,248,.35);
            transform: translateY(-2px);
        }

        .btn-login:active { transform: translateY(0); }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,.05);
        }

        .divider span { color: var(--muted); font-size: .7rem; }

        /* ── Footer ── */
        .card-footer {
            text-align: center;
            animation: fadeUp .6s .55s both;
        }

        .card-footer p { color: var(--muted); font-size: .8rem; margin-bottom: 6px; }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: .8rem;
            transition: color .2s;
        }

        .card-footer a:hover { color: #7dd3fc; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .panel { width: 92vw; padding: 32px 24px 28px; }
            .theme-toggle { top: 16px; right: 16px; }
        }
    </style>
</head>
<body>

<!-- Three.js 3D background -->
<canvas id="bgCanvas"></canvas>

<!-- Theme toggle -->
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark/light theme">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
</button>

<!-- Login UI -->
<div id="overlay">
    <div class="panel" id="loginPanel">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="#050b18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div>
                <div class="brand-name"><span>Nex</span>Exam</div>
                <div class="brand-tag">Online Portal</div>
            </div>
        </div>

        <h2 class="login-title">Welcome Back</h2>
        <p class="login-sub">Enter your credentials to continue</p>

        <!-- Thymeleaf alerts -->
        <div th:if="${param.error}" class="alert-box alert-error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert-box alert-success">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Successfully logged out.
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" class="form-input" id="username" name="username"
                           placeholder="Enter your username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" class="form-input" id="password" name="password"
                           placeholder="••••••••" required>
                    <button type="button" class="eye-btn" id="eyeToggle">
                        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span class="shine"></span>
                SIGN IN &nbsp;&#8594;
            </button>
        </form>

        <div class="divider"><span>or</span></div>

        <div class="card-footer">
            <p>Don't have an account? <a th:href="@{/register}">Create one</a></p>
            <a th:href="@{/}">&#8962; Back to Home</a>
        </div>

    </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
    // theme init (before three.js renders, so first frame is correct)
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-bs-theme', savedTheme);

    const THEME_COLORS = {
        dark:  { bg: 0x050b18, fog: 0x050b18, grid: 0x0a2540, star: 0x38bdf8, ambient: 0x112244 },
        light: { bg: 0xeef2fa, fog: 0xeef2fa, grid: 0xc7d2e0, star: 0x0891b2, ambient: 0xaab6c9 }
    };

    (function () {
        const canvas = document.getElementById('bgCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const initColors = THEME_COLORS[savedTheme];
        renderer.setClearColor(initColors.bg, 1);
        scene.fog = new THREE.FogExp2(initColors.fog, 0.042);

        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(0, 0, 22);

        function resize() {
            renderer.setSize(innerWidth, innerHeight);
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);

        // Lights
        const ambient = new THREE.AmbientLight(initColors.ambient, 1.2);
        scene.add(ambient);
        const pt1 = new THREE.PointLight(0x38bdf8, 3, 40);
        pt1.position.set(-6, 6, 8);
        scene.add(pt1);
        const pt2 = new THREE.PointLight(0x7c3aed, 2, 30);
        pt2.position.set(8, -4, 6);
        scene.add(pt2);

        function stdMat(color, opacity = 1) {
            return new THREE.MeshStandardMaterial({
                color, metalness: .85, roughness: .15,
                transparent: opacity < 1, opacity,
                emissive: color, emissiveIntensity: .12
            });
        }

        // Torus rings
        const rings = [];
        [
            [7,   .035, 0.3, 0.0, 0x38bdf8],
            [5.5, .042, 0.8, 0.7, 0x7c3aed],
            [4.2, .050, 1.1, 1.4, 0x38bdf8],
            [3.1, .058, 0.5, 2.1, 0x0ea5e9],
        ].forEach(([r, t, rx, ry, col]) => {
            const m = new THREE.Mesh(new THREE.TorusGeometry(r, t, 8, 120), stdMat(col, .65));
            m.rotation.x = rx;
            m.rotation.y = ry;
            scene.add(m);
            rings.push(m);
        });

        // Center icosahedron
        const icoGeo = new THREE.IcosahedronGeometry(1.1, 0);
        const ico = new THREE.Mesh(icoGeo, new THREE.MeshStandardMaterial({
            color: 0x38bdf8, metalness: .9, roughness: .1,
            emissive: 0x0ea5e9, emissiveIntensity: .3,
            transparent: true, opacity: .85
        }));
        scene.add(ico);
        const icoW = new THREE.Mesh(icoGeo, new THREE.MeshBasicMaterial({
            color: 0x7dd3fc, wireframe: true, transparent: true, opacity: .2
        }));
        scene.add(icoW);

        // Floating crystals
        const floaters = [];
        [
            [new THREE.OctahedronGeometry(.28, 0),  0x38bdf8],
            [new THREE.TetrahedronGeometry(.22, 0),  0x7c3aed],
            [new THREE.IcosahedronGeometry(.18, 0),  0x0ea5e9],
            [new THREE.OctahedronGeometry(.20, 0),   0x38bdf8],
            [new THREE.TetrahedronGeometry(.30, 0),  0x818cf8],
            [new THREE.OctahedronGeometry(.15, 0),   0x38bdf8],
            [new THREE.IcosahedronGeometry(.25, 0),  0x7c3aed],
            [new THREE.TetrahedronGeometry(.18, 0),  0x0ea5e9],
        ].forEach(([geo, col]) => {
            const mesh = new THREE.Mesh(geo, stdMat(col, .7));
            const a = Math.random() * Math.PI * 2;
            const rad = 5 + Math.random() * 5;
            mesh.position.set(Math.cos(a) * rad, (Math.random() - .5) * 8, Math.sin(a) * rad - 4);
            mesh.userData = { spd: .3 + Math.random() * .4, offset: Math.random() * Math.PI * 2, rad, a };
            scene.add(mesh);
            floaters.push(mesh);
        });

        // Star particles
        const ptPos = new Float32Array(1800 * 3);
        for (let i = 0; i < ptPos.length; i++) ptPos[i] = (Math.random() - .5) * 60;
        const ptGeo = new THREE.BufferGeometry();
        ptGeo.setAttribute('position', new THREE.BufferAttribute(ptPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: initColors.star, size: .06, transparent: true, opacity: .45
        });
        const stars = new THREE.Points(ptGeo, starMat);
        scene.add(stars);

        // Grid floor
        const grid = new THREE.GridHelper(60, 30, initColors.grid, initColors.grid);
        grid.position.y = -9;
        grid.material.transparent = true;
        grid.material.opacity = .35;
        scene.add(grid);

        // ── theme toggle wiring ──
        const toggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const SUN = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>';
        const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            themeIcon.innerHTML = theme === 'light' ? SUN : MOON;

            const c = THEME_COLORS[theme];
            renderer.setClearColor(c.bg, 1);
            scene.fog.color.setHex(c.fog);
            ambient.color.setHex(c.ambient);
            starMat.color.setHex(c.star);
            grid.material.color.setHex(c.grid);
        }

        applyTheme(savedTheme);
        toggleBtn.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            applyTheme(next);
        });

        // Mouse tracking
        let mx = 0, my = 0, camX = 0, camY = 0;
        window.addEventListener('mousemove', (e) => {
            mx = (e.clientX / innerWidth) * 2 - 1;
            my = -((e.clientY / innerHeight) * 2 - 1);

            // Panel spotlight
            const panel = document.getElementById('loginPanel');
            if (panel) {
                const r = panel.getBoundingClientRect();
                panel.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
                panel.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
            }
        });

        let t = 0;
        function animate() {
            requestAnimationFrame(animate);
            t += .008;

            // Smooth camera parallax
            camX += (mx * .25 - camX) * .06;
            camY += (my * .20 - camY) * .06;
            camera.position.x = camX * 3;
            camera.position.y = camY * 2.5;
            camera.lookAt(0, 0, 0);

            // Rings
            rings[0].rotation.x += .003;  rings[0].rotation.y += .004;
            rings[1].rotation.x -= .0035; rings[1].rotation.z += .0025;
            rings[2].rotation.y += .006;  rings[2].rotation.z -= .003;
            rings[3].rotation.x += .005;  rings[3].rotation.y -= .004;

            // Ico pulse
            const pulse = Math.sin(t * 2) * .08 + 1;
            ico.rotation.x += .006; ico.rotation.y += .008;
            icoW.rotation.x = ico.rotation.x; icoW.rotation.y = ico.rotation.y;
            ico.scale.setScalar(pulse); icoW.scale.setScalar(pulse * 1.02);

            // Lights orbit
            pt1.position.x = Math.sin(t * .7) * 8;
            pt1.position.y = Math.cos(t * .5) * 5;
            pt2.position.x = Math.cos(t * .6) * 7;
            pt2.position.y = Math.sin(t * .8) * 4;

            // Floaters orbit
            floaters.forEach(f => {
                const d = f.userData;
                const na = d.a + t * d.spd * .12;
                f.position.x = Math.cos(na) * d.rad;
                f.position.z = Math.sin(na) * d.rad - 4;
                f.position.y = Math.sin(t * d.spd + d.offset) * 1.8;
                f.rotation.x += .015;
                f.rotation.y += .012;
            });

            stars.rotation.y += .0003;
            renderer.render(scene, camera);
        }
        animate();
    })();

    // Password toggle
    document.getElementById('eyeToggle').addEventListener('click', function () {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>' +
                '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>' +
                '<path d="m6.51 6.51 10.98 10.98"/>';
        } else {
            pwd.type = 'password';
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    });
</script>
