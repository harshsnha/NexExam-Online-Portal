<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexExam - Official Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;800&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0f172a;
            --navy-2: #1e293b;
            --gold: #b8925a;
            --gold-light: #d4af7a;
            --gold-glow: rgba(184, 146, 90, 0.35);
            --paper: #fdfcf8;
            --ink: #334155;
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(160deg, #e8ecf3 0%, #f4f1ea 100%);
            padding: 60px 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        .certificate-container {
            width: 900px;
            max-width: 100%;
            margin: 0 auto;
            background: var(--paper);
            padding: 14px;
            position: relative;
            box-shadow: 0 40px 80px -20px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(15,23,42,.04);
            background-image: radial-gradient(circle, rgba(15,23,42,0.035) 1px, transparent 1px);
            background-size: 22px 22px;
            animation: certIn .8s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes certIn {
            from { opacity: 0; transform: translateY(24px) scale(.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Outer navy frame with gold hairline */
        .outer-border {
            border: 10px solid var(--navy);
            box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 4px rgba(184,146,90,.25);
            padding: 3px;
        }

        .inner-border {
            border: 1.5px solid var(--gold);
            padding: 44px 50px;
            position: relative;
            background:
                radial-gradient(ellipse at top, rgba(184,146,90,0.05), transparent 55%),
                radial-gradient(ellipse at bottom, rgba(184,146,90,0.05), transparent 55%);
        }

        /* Ornamental corner flourishes */
        .corner {
            position: absolute;
            width: 46px; height: 46px;
            border: 2px solid var(--gold);
            opacity: .85;
        }
        .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
        .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

        .header-logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            color: var(--navy);
            font-size: 1.6rem;
            letter-spacing: .5px;
        }
        .header-logo span { color: var(--gold); }

        .header-divider {
            width: 70px; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 14px auto 0;
        }

        .cert-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 3.1rem;
            color: var(--navy);
            margin: 22px 0 4px;
            letter-spacing: 1px;
        }

        .cert-subtitle {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .cert-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            color: var(--ink);
            margin: 10px 0;
        }

        .presented-line {
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 2rem;
        }

        .recipient-name {
            font-family: 'Great Vibes', cursive;
            font-size: 3.6rem;
            color: var(--navy);
            display: inline-block;
            margin: 10px 0 6px;
            min-width: 380px;
            line-height: 1;
        }

        .recipient-underline {
            width: 340px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 1.2rem;
        }

        .exam-title { font-weight: 800; color: var(--navy); }
        .score-highlight {
            color: var(--gold);
            font-weight: 800;
        }

        .footer-section { margin-top: 46px; }

        .qr-frame {
            display: inline-block;
            padding: 5px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }

        .verify-label {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 6px;
            color: var(--navy);
        }

        /* Refined ribbon-style seal */
        .seal-wrap { position: relative; display: inline-block; }
        .seal {
            width: 108px; height: 108px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #26314a, var(--navy) 70%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            border: 3px double var(--gold);
            box-shadow: 0 0 0 3px rgba(184,146,90,.15), 0 10px 20px rgba(15,23,42,.25);
            transform: rotate(-12deg);
            color: var(--gold-light);
        }
        .seal i { font-size: 1.4rem; margin-bottom: 2px; }
        .seal-text {
            font-size: .52rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-align: center;
            line-height: 1.3;
        }

        .signature-img { max-width: 140px; height: auto; margin-bottom: -12px; }
        .signature-label {
            font-weight: 800;
            color: var(--navy);
            border-top: 1px solid #cbd5e1;
            padding-top: 6px;
            font-size: .8rem;
            letter-spacing: .5px;
        }

        .cert-id-box {
            position: absolute; top: 20px; right: 30px; text-align: right;
            font-family: 'Plus Jakarta Sans', sans-serif;
            z-index: 2;
        }
        .cert-id-label { color: #94a3b8; font-weight: 600; font-size: .72rem; letter-spacing: .5px; }
        .cert-id-value { font-weight: 800; color: var(--navy); font-size: .92rem; }

        .btn-print {
            background: var(--navy);
            color: var(--gold-light);
            border: 1px solid var(--gold);
            font-weight: 700;
            letter-spacing: .5px;
            transition: .3s;
        }
        .btn-print:hover {
            background: #1a2540;
            box-shadow: 0 8px 20px rgba(15,23,42,.3);
            color: var(--gold-light);
        }

        @media print {
            body { background: none; padding: 0; }
            .no-print { display: none; }
            .certificate-container { box-shadow: none; animation: none; }
            .outer-border { border-width: 8px; }
        }

        @media (max-width: 950px) {
            .certificate-container { width: 100%; }
            .inner-border { padding: 30px 22px; }
            .cert-title { font-size: 2.2rem; }
            .recipient-name { font-size: 2.6rem; min-width: 0; }
            .recipient-underline { width: 220px; }
        }
    </style>
</head>
<body>

<div class="container text-center mb-4 no-print">
    <button onclick="window.print()" class="btn btn-print btn-lg rounded-pill px-5 shadow">
        <i class="bi bi-printer-fill me-2"></i>Print Certificate
    </button>
</div>

<div class="certificate-container">
    <div class="cert-id-box">
        <div class="cert-id-label">CERTIFICATE NO:</div>
        <div class="cert-id-value" th:text="${specialNumber}">ID-101</div>
    </div>

    <div class="outer-border">
        <div class="inner-border">
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>

            <div class="text-center">
                <div class="header-logo"><span>Nex</span>Exam</div>
                <div class="header-divider"></div>

                <div class="cert-title">Certificate</div>
                <div class="cert-subtitle">Of Achievement</div>

                <p class="presented-line">This certificate is proudly presented to</p>
                <div class="recipient-name" th:text="${student.fullName}">Rahul Kumar</div>
                <div class="recipient-underline"></div>

                <p class="cert-text mt-3" style="max-width: 560px; margin-left: auto; margin-right: auto;">
                    Has successfully completed the <span class="exam-title" th:text="${result.exam.title}">Java Basics</span>
                    examination with an outstanding performance score of
                    <strong class="score-highlight" th:text="${percentage} + '%'">85%</strong>.
                </p>

                <div class="row footer-section align-items-end">
                    <div class="col-4 text-center">
                        <div class="qr-frame">
                            <img th:src="${qrCodeUrl}" style="width: 80px; display: block;">
                        </div>
                        <div class="verify-label">SCAN TO VERIFY</div>
                        <div class="cert-text small mt-2" style="font-size: .82rem;" th:text="${#temporals.format(result.submissionTime, 'dd MMMM, yyyy')}">Date</div>
                    </div>
                    <div class="col-4 d-flex justify-content-center">
                        <div class="seal-wrap">
                            <div class="seal">
                                <i class="bi bi-award-fill"></i>
                                <span class="seal-text">OFFICIAL<br>SEAL</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-4 text-center">
                        <div>
                            <img th:src="@{/images/signature.png}" class="signature-img" alt="Admin Signature">
                        </div>
                        <div class="signature-label">ADMIN SIGNATURE</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
