<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexExam - Submission Successful</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Flash prevention -->
    <script th:inline="none">
        (function () {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-void:      #090b14;
            --bg-surface:   #12162a;
            --glass:        rgba(18, 22, 42, 0.72);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #eef0f9;
            --text-muted:   #9099b8;
            --accent-violet:#8b5cf6;
            --accent-cyan:  #22d3ee;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
            --pass: #34d399;
            --fail: #f87171;
            --gold: #fbbf24;
        }

        [data-bs-theme="light"] {
            --bg-void:      #f4f5fb;
            --bg-surface:   #ffffff;
            --glass:        rgba(255, 255, 255, 0.8);
            --border-glass: rgba(15, 23, 42, 0.08);
            --text-primary: #1b2140;
            --text-muted:   #5b6489;
            --accent-violet:#7c3aed;
            --accent-cyan:  #0891b2;
        }

        html, body {
            min-height: 100vh;
            background: var(--bg-void) !important;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            transition: background .4s, color .4s;
        }

        body { display: flex; align-items: center; }

        #bgCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            opacity: 1; transition: opacity .5s;
        }
        [data-bs-theme="light"] #bgCanvas { opacity: 0.25; }

        .result-container { position: relative; z-index: 10; padding: 50px 0; width: 100%; }

        /* ── Glass card ── */
        .result-card {
            background: var(--glass);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            padding: 4rem 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,.5);
            position: relative;
            overflow: hidden;
            color: var(--text-primary);
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glow-overlay-pass {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--pass), transparent);
        }
        .glow-overlay-fail {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
        }

        .result-icon-wrap {
            width: 110px; height: 110px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            position: relative;
            animation: iconPop .7s .1s cubic-bezier(.22,1.4,.36,1) both;
        }

        @keyframes iconPop {
            from { opacity: 0; transform: scale(.4) rotate(-25deg); }
            to   { opacity: 1; transform: scale(1) rotate(0); }
        }

        .result-icon-wrap.pass { background: rgba(251,191,36,.12); box-shadow: 0 0 45px rgba(251,191,36,.3); }
        .result-icon-wrap.fail { background: rgba(34,211,238,.12); box-shadow: 0 0 45px rgba(34,211,238,.3); }

        .result-icon { font-size: 3.2rem; }

        h1.result-title { font-family: 'Sora', sans-serif; font-weight: 800; letter-spacing: -.5px; }

        .score-display {
            font-family: 'Sora', sans-serif;
            font-size: 5rem; font-weight: 800; line-height: 1;
            margin-bottom: 0.5rem; letter-spacing: -2px;
            animation: fadeUp .6s .2s both;
        }

        .score-raw { font-size: 1.1rem; color: var(--text-muted); font-weight: 600; animation: fadeUp .6s .25s both; }
        .score-raw span.highlight { color: var(--text-primary); font-family: 'Sora', sans-serif; }

        .progress-custom {
            height: 12px; background: rgba(255,255,255,.06);
            border-radius: 50px; overflow: hidden;
            margin: 2rem auto; max-width: 400px;
            animation: fadeUp .6s .3s both;
        }

        .progress-bar-fill {
            height: 100%; border-radius: 50px;
            width: 0%;
            transition: width 1.1s cubic-bezier(.22,1,.36,1);
        }
        .progress-bar-fill.pass { background: var(--pass); }
        .progress-bar-fill.fail { background: var(--accent-gradient); }

        .btn-modern {
            border-radius: 14px; padding: 12px 30px;
            font-family: 'Sora', sans-serif;
            font-weight: 700; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
            font-size: .85rem;
        }

        .btn-review {
            background: var(--accent-gradient);
            color: #090b14; border: none;
            box-shadow: 0 0 20px rgba(139,92,246,.3);
        }
        .btn-review:hover { box-shadow: 0 0 32px rgba(139,92,246,.5); transform: translateY(-3px); color:#090b14; }

        .btn-home {
            background: rgba(139,92,246,.08);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
        }
        .btn-home:hover { background: rgba(139,92,246,.16); border-color: rgba(139,92,246,.3); transform: translateY(-3px); }

        .action-row { animation: fadeUp .6s .35s both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .result-card, .result-icon-wrap, .score-display, .score-raw, .progress-custom, .action-row {
                animation: none !important; opacity: 1 !important; transform: none !important;
            }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container result-container">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">

            <th:block th:with="percentage=${(total > 0) ? (score * 100.0) / total : 0}, isPass=${percentage >= 50}">

                <div class="result-card">
                    <div th:class="${isPass ? 'glow-overlay-pass' : 'glow-overlay-fail'}"></div>

                    <div th:if="${isPass}">
                        <div class="result-icon-wrap pass">
                            <i class="bi bi-trophy-fill result-icon" style="color: var(--gold);"></i>
                        </div>
                        <h1 class="result-title mb-2">Excellent Work!</h1>
                        <p style="color: var(--text-muted);" class="mb-4">You've cleared the exam with flying colors.</p>
                    </div>
                    <div th:unless="${isPass}">
                        <div class="result-icon-wrap fail">
                            <i class="bi bi-rocket-takeoff-fill result-icon" style="color: var(--accent-cyan);"></i>
                        </div>
                        <h1 class="result-title mb-2">Submission Successful</h1>
                        <p style="color: var(--text-muted);" class="mb-4">Every attempt is a step towards mastery. Keep practicing!</p>
                    </div>

                    <hr style="border-color: var(--border-glass); opacity: .5;" class="my-4">

                    <div class="score-display" th:style="|color: ${isPass ? 'var(--pass)' : 'var(--text-primary)'}|">
                        <span th:text="|${#numbers.formatDecimal(percentage, 1, 1)}%|">75.0%</span>
                    </div>
                    <div class="score-raw">
                        Score Achieved: <span class="highlight" th:text="${score}">15</span>
                        / <span th:text="${total}">20</span> Points
                    </div>

                    <div class="progress-custom">
                        <div class="progress-bar-fill"
                             th:classappend="${isPass ? 'pass' : 'fail'}"
                             th:attr="data-target=${percentage}">
                        </div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-center gap-3 mt-5 action-row">
                        <a th:href="@{/student/dashboard}" class="btn btn-modern btn-home">
                            <i class="bi bi-grid-fill me-2"></i>Dashboard
                        </a>
                        <a th:if="${resultId != null}" th:href="@{/student/review/{id}(id=${resultId})}" class="btn btn-modern btn-review shadow-sm">
                            <i class="bi bi-eye-fill me-2"></i>Review Answers
                        </a>
                    </div>
                </div>

            </th:block>
        </div>
    </div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script th:inline="none">
(function () {
    if (typeof THREE === 'undefined') { console.error('[NexExam 3D] Three.js failed to load.'); return; }
    try {
    const canvas = document.getElementById('bgCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    function isLightTheme() { return document.documentElement.getAttribute('data-bs-theme') === 'light'; }
    const DARK_BG = 0x090b14, LIGHT_BG = 0xf4f5fb;

    const scene = new THREE.Scene();
    renderer.setClearColor(isLightTheme() ? LIGHT_BG : DARK_BG, 1);
    scene.fog = new THREE.FogExp2(isLightTheme() ? LIGHT_BG : DARK_BG, 0.045);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 1, 20);
    function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    resize(); window.addEventListener('resize', resize);

    scene.add(new THREE.AmbientLight(0x140d40, 1.5));
    const pl1 = new THREE.PointLight(0x8b5cf6, 2.5, 40); pl1.position.set(-7,6,8); scene.add(pl1);
    const pl2 = new THREE.PointLight(0x22d3ee, 2, 30); pl2.position.set(8,-4,6); scene.add(pl2);

    function mat(c, op = 1) { return new THREE.MeshStandardMaterial({ color: c, metalness:.85, roughness:.15, transparent:op<1, opacity:op, emissive:c, emissiveIntensity:.15 }); }

    const rings = [];
    var ringData = [[7,.035,0.3,0.0,0x22d3ee],[5.5,.042,0.8,0.7,0x8b5cf6],[4.2,.05,1.1,1.4,0xa78bfa]];
    ringData.forEach(function(d) {
        var r=d[0],t=d[1],rx=d[2],ry=d[3],col=d[4];
        const m = new THREE.Mesh(new THREE.TorusGeometry(r,t,8,120), mat(col,.55)); m.rotation.x=rx; m.rotation.y=ry; scene.add(m); rings.push(m);
    });

    // Rocket/trophy-inspired signature: a soft rotating star-burst of shards
    const shards = [];
    var shardData = [[new THREE.TetrahedronGeometry(.3,0),0xfbbf24],[new THREE.OctahedronGeometry(.26,0),0x22d3ee],[new THREE.IcosahedronGeometry(.22,0),0x8b5cf6],[new THREE.TetrahedronGeometry(.2,0),0xa78bfa],[new THREE.OctahedronGeometry(.24,0),0xfbbf24],[new THREE.IcosahedronGeometry(.18,0),0x22d3ee]];
    shardData.forEach(function(d) {
        var geo=d[0], col=d[1];
        const m = new THREE.Mesh(geo, mat(col,.7)); const a=Math.random()*Math.PI*2, rad=5+Math.random()*5;
        m.position.set(Math.cos(a)*rad,(Math.random()-.5)*8,Math.sin(a)*rad-4); m.userData={spd:.3+Math.random()*.4,offset:Math.random()*Math.PI*2,rad,a}; scene.add(m); shards.push(m);
    });

    const ptPos = new Float32Array(1600*3); for(let i=0;i<ptPos.length;i++) ptPos[i]=(Math.random()-.5)*60;
    const ptGeo = new THREE.BufferGeometry(); ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
    scene.add(new THREE.Points(ptGeo,new THREE.PointsMaterial({color:0x22d3ee,size:.06,transparent:true,opacity:.4})));

    let mx=0,my=0,cx=0,cy=0,t=0;
    window.addEventListener('mousemove', function(e){ mx=(e.clientX/innerWidth)*2-1; my=-((e.clientY/innerHeight)*2-1); });

    const themeObserver = new MutationObserver(function() {
        const light = isLightTheme();
        renderer.setClearColor(light ? LIGHT_BG : DARK_BG, 1);
        scene.fog.color.set(light ? LIGHT_BG : DARK_BG);
    });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    (function animate(){
        requestAnimationFrame(animate);
        if (reduceMotion) { renderer.render(scene, camera); return; }
        t+=.008;
        cx+=(mx*.2-cx)*.05; cy+=(my*.15-cy)*.05; camera.position.x=cx*2.5; camera.position.y=1+cy*1.5; camera.lookAt(0,0,0);
        rings[0].rotation.x+=.003; rings[0].rotation.y+=.004;
        rings[1].rotation.x-=.0035; rings[1].rotation.z+=.0025;
        rings[2].rotation.y+=.006; rings[2].rotation.z-=.003;
        pl1.position.x=Math.sin(t*.7)*8; pl1.position.y=Math.cos(t*.5)*5;
        pl2.position.x=Math.cos(t*.6)*7; pl2.position.y=Math.sin(t*.8)*4;
        shards.forEach(function(f){var d=f.userData,na=d.a+t*d.spd*.12; f.position.x=Math.cos(na)*d.rad; f.position.z=Math.sin(na)*d.rad-4; f.position.y=Math.sin(t*d.spd+d.offset)*1.8; f.rotation.x+=.015; f.rotation.y+=.012;});
        renderer.render(scene,camera);
    })();
    } catch (err) {
        console.error('[NexExam 3D] Result background failed:', err);
    }
})();
</script>

<!-- Animate score bar in -->
<script th:inline="none">
(function () {
    const bar = document.querySelector('.progress-bar-fill');
    if (!bar) return;
    const target = bar.getAttribute('data-target') || 0;
    setTimeout(function() { bar.style.width = target + '%'; }, 400);
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
