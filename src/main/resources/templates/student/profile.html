<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - NexExam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Flash prevention -->
    <script th:inline="none">
        (function () {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-void:      #090b14;
            --bg-surface:   #12162a;
            --glass:        rgba(18, 22, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #eef0f9;
            --text-muted:   #9099b8;
            --accent-violet:#8b5cf6;
            --accent-cyan:  #22d3ee;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
            --input-bg:  rgba(255,255,255,.03);
            --warn: #f59e0b;
            --fail: #f87171;
        }

        [data-bs-theme="light"] {
            --bg-void:      #f4f5fb;
            --bg-surface:   #ffffff;
            --glass:        rgba(255, 255, 255, 0.82);
            --border-glass: rgba(15, 23, 42, 0.08);
            --text-primary: #1b2140;
            --text-muted:   #5b6489;
            --accent-violet:#7c3aed;
            --accent-cyan:  #0891b2;
            --input-bg:  rgba(15,23,42,.04);
        }

        body {
            background-color: var(--bg-void) !important;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color .4s ease, color .4s ease;
        }

        #bgCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        [data-bs-theme="light"] #bgCanvas { opacity: .22; }

        .main-container { position: relative; z-index: 10; padding-top: 100px; padding-bottom: 50px; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 2rem;
            height: 100%;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            animation: fadeUp .6s ease-out both;
            transition: border-color .3s, box-shadow .3s;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,92,246,.4), transparent);
        }

        .glass-card:hover {
            border-color: rgba(139,92,246,.3);
            box-shadow: 0 25px 50px rgba(0,0,0,.35), 0 0 40px rgba(139,92,246,.12);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .profile-pic-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 1.5rem;
        }

        .profile-pic-lg {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            border: 4px solid transparent;
            background: var(--accent-gradient) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 4px;
            box-shadow: 0 0 30px rgba(139,92,246,.3);
        }

        .profile-pic-placeholder {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(139,92,246,.3);
            background: rgba(139,92,246,.08);
            display: flex; align-items: center; justify-content: center;
        }

        .form-label { font-weight: 600; color: var(--text-muted); font-size: 0.85rem; }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-primary) !important;
            padding: 0.75rem 1rem;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            border-color: rgba(139,92,246,.5);
            box-shadow: 0 0 0 3px rgba(139,92,246,.14);
            background: rgba(139,92,246,.05);
        }

        .btn-modern {
            border-radius: 12px; padding: 10px 20px;
            font-family: 'Sora', sans-serif;
            font-weight: 700; transition: 0.3s; border: none;
        }
        .btn-update {
            background: var(--accent-gradient);
            color: #090b14;
            box-shadow: 0 0 16px rgba(139,92,246,.3);
        }
        .btn-update:hover { box-shadow: 0 0 26px rgba(139,92,246,.5); transform: translateY(-2px); color: #090b14; }

        .btn-password { background: rgba(245, 158, 11, 0.15); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-password:hover { background: rgba(245, 158, 11, 0.25); }

        .btn-remove { background: rgba(248, 113, 113, 0.1); color: var(--fail); border: 1px solid rgba(248, 113, 113, 0.25); margin-top: 10px; }
        .btn-remove:hover { background: rgba(248, 113, 113, 0.2); }

        .section-title { font-family: 'Sora', sans-serif; }

        @media (prefers-reduced-motion: reduce) {
            .glass-card { animation: none !important; opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container main-container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 bg-success bg-opacity-10 text-success mb-4 rounded-4">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="glass-card text-center">
                <div class="profile-pic-container">
                    <img th:if="${student.profilePicUrl != null}" th:src="@{${student.profilePicUrl}}" class="profile-pic-lg">
                    <div th:if="${student.profilePicUrl == null}" class="profile-pic-placeholder">
                        <i class="bi bi-person fs-1" style="color: var(--accent-cyan);"></i>
                    </div>
                </div>

                <h3 class="fw-bold mb-1 section-title" th:text="${student.fullName}">Student Name</h3>
                <p style="color: var(--text-muted);" class="small mb-4" th:text="${student.username}">email@example.com</p>

                <hr style="border-color: var(--border-glass); opacity: .6;" class="mb-4">

                <form th:action="@{/student/profile/update-picture}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" class="form-control form-control-sm" id="profilePicFile" name="profilePicFile" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-modern btn-update w-100">
                        <i class="bi bi-cloud-arrow-up me-2"></i>Upload New
                    </button>
                </form>

                <form th:if="${student.profilePicUrl != null}" th:action="@{/student/profile/remove-picture}" method="post">
                    <button type="submit" class="btn btn-modern btn-remove w-100" onclick="return confirm('Remove profile picture?')">
                        <i class="bi bi-trash3 me-2"></i>Remove Photo
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="glass-card mb-4" style="animation-delay: .1s;">
                <h4 class="fw-bold mb-4 section-title"><i class="bi bi-person-gear me-2" style="color: var(--accent-cyan);"></i>Profile Details</h4>
                <form th:action="@{/student/profile/update-details}" th:object="${student}" method="post">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email (Immutable)</label>
                            <input type="email" class="form-control" th:field="*{username}" readonly disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" th:field="*{mobileNumber}">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-modern btn-update mt-2">Save Changes</button>
                </form>
            </div>

            <div class="glass-card" style="animation-delay: .15s;">
                <h4 class="fw-bold mb-4 section-title"><i class="bi bi-shield-lock me-2" style="color: var(--warn);"></i>Security Settings</h4>
                <form th:action="@{/student/profile/update-password}" method="post">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" name="oldPassword" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" name="newPassword" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" name="confirmPassword" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-modern btn-password mt-2">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script th:inline="none">
(function () {
    if (typeof THREE === 'undefined') { console.error('[NexExam 3D] Three.js failed to load.'); return; }
    try {
    const canvas = document.getElementById('bgCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    function isLightTheme() { return document.documentElement.getAttribute('data-bs-theme') === 'light'; }
    const DARK_BG = 0x090b14, LIGHT_BG = 0xf4f5fb;

    const scene = new THREE.Scene();
    renderer.setClearColor(isLightTheme() ? LIGHT_BG : DARK_BG, 1);
    scene.fog = new THREE.FogExp2(isLightTheme() ? LIGHT_BG : DARK_BG, 0.045);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 1, 20);
    function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    resize(); window.addEventListener('resize', resize);

    scene.add(new THREE.AmbientLight(0x140d40, 1.5));
    const pl1 = new THREE.PointLight(0x8b5cf6, 2.5, 40); pl1.position.set(-7,6,8); scene.add(pl1);
    const pl2 = new THREE.PointLight(0x22d3ee, 2, 30); pl2.position.set(8,-4,6); scene.add(pl2);

    function mat(c, op = 1) { return new THREE.MeshStandardMaterial({ color: c, metalness:.85, roughness:.15, transparent:op<1, opacity:op, emissive:c, emissiveIntensity:.12 }); }

    const rings = [];
    var ringData = [[7,.03,0.25,0.0,0x22d3ee],[5.5,.038,0.7,0.9,0x8b5cf6],[4,.045,1.1,1.7,0xa78bfa]];
    ringData.forEach(function (d) {
        var r=d[0],t=d[1],rx=d[2],ry=d[3],col=d[4];
        var m = new THREE.Mesh(new THREE.TorusGeometry(r,t,8,120), mat(col,.55)); m.rotation.x=rx; m.rotation.y=ry; scene.add(m); rings.push(m);
    });

    // Identity-card-like signature — a rounded plate with an inset "avatar" circle
    const plateGroup = new THREE.Group();
    var plateGeo = new THREE.CylinderGeometry(1, 1, 0.18, 40);
    var plateMesh = new THREE.Mesh(plateGeo, new THREE.MeshStandardMaterial({ color: 0x8b5cf6, metalness: .9, roughness: .1, emissive: 0x8b5cf6, emissiveIntensity: .25, transparent: true, opacity: .85 }));
    plateMesh.rotation.x = Math.PI / 2;
    var avatarGeo = new THREE.TorusGeometry(0.45, 0.06, 12, 40);
    var avatarMesh = new THREE.Mesh(avatarGeo, new THREE.MeshStandardMaterial({ color: 0x22d3ee, metalness: .9, roughness: .1, emissive: 0x22d3ee, emissiveIntensity: .4 }));
    avatarMesh.position.z = 0.12;
    plateGroup.add(plateMesh, avatarMesh);
    scene.add(plateGroup);

    const floaters = [];
    var floaterData = [[new THREE.OctahedronGeometry(.24,0),0x22d3ee],[new THREE.TetrahedronGeometry(.2,0),0x8b5cf6],[new THREE.IcosahedronGeometry(.16,0),0x38bdf8],[new THREE.OctahedronGeometry(.18,0),0xa78bfa],[new THREE.TetrahedronGeometry(.26,0),0x22d3ee],[new THREE.OctahedronGeometry(.14,0),0x8b5cf6]];
    floaterData.forEach(function (d) {
        var geo=d[0], col=d[1];
        var m = new THREE.Mesh(geo, mat(col,.6)); var a=Math.random()*Math.PI*2, rad=5+Math.random()*5;
        m.position.set(Math.cos(a)*rad,(Math.random()-.5)*8,Math.sin(a)*rad-4); m.userData={spd:.25+Math.random()*.35,offset:Math.random()*Math.PI*2,rad,a}; scene.add(m); floaters.push(m);
    });

    const ptPos = new Float32Array(1400*3); for(let i=0;i<ptPos.length;i++) ptPos[i]=(Math.random()-.5)*60;
    const ptGeo = new THREE.BufferGeometry(); ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
    scene.add(new THREE.Points(ptGeo,new THREE.PointsMaterial({color:0x22d3ee,size:.05,transparent:true,opacity:.35})));

    let mx=0,my=0,cx=0,cy=0,t=0;
    window.addEventListener('mousemove', function (e) { mx=(e.clientX/innerWidth)*2-1; my=-((e.clientY/innerHeight)*2-1); });

    const themeObserver = new MutationObserver(function () {
        var light = isLightTheme();
        renderer.setClearColor(light ? LIGHT_BG : DARK_BG, 1);
        scene.fog.color.set(light ? LIGHT_BG : DARK_BG);
    });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    (function animate(){
        requestAnimationFrame(animate);
        if (reduceMotion) { renderer.render(scene, camera); return; }
        t+=.007;
        cx+=(mx*.15-cx)*.05; cy+=(my*.1-cy)*.05; camera.position.x=cx*2.5; camera.position.y=1+cy*1.5; camera.lookAt(0,0,0);
        rings[0].rotation.x+=.0025; rings[0].rotation.y+=.003;
        rings[1].rotation.x-=.003; rings[1].rotation.z+=.002;
        rings[2].rotation.y+=.005; rings[2].rotation.z-=.0025;
        plateGroup.rotation.y += .008;
        plateGroup.position.y = Math.sin(t * 1.4) * .3;
        avatarMesh.rotation.z -= .01;
        pl1.position.x=Math.sin(t*.65)*8; pl1.position.y=Math.cos(t*.45)*5;
        pl2.position.x=Math.cos(t*.55)*7; pl2.position.y=Math.sin(t*.75)*4;
        floaters.forEach(function(f){var d=f.userData,na=d.a+t*d.spd*.1; f.position.x=Math.cos(na)*d.rad; f.position.z=Math.sin(na)*d.rad-4; f.position.y=Math.sin(t*d.spd+d.offset)*1.6; f.rotation.x+=.012; f.rotation.y+=.01;});
        renderer.render(scene,camera);
    })();
    } catch (err) {
        console.error('[NexExam 3D] Profile background failed:', err);
    }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
