<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexExam - Create New Exam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Flash prevention -->
    <script th:inline="none">
        (function () {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-void:      #090b14;
            --bg-surface:   #12162a;
            --glass:        rgba(18, 22, 42, 0.68);
            --border-glass: rgba(255, 255, 255, 0.09);
            --input-bg:     rgba(255, 255, 255, 0.03);
            --text-primary: #eef0f9;
            --text-muted:   #9099b8;
            --accent-violet:#8b5cf6;
            --accent-cyan:  #22d3ee;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
        }

        [data-bs-theme="light"] {
            --bg-void:      #f4f5fb;
            --bg-surface:   #ffffff;
            --glass:        rgba(255, 255, 255, 0.85);
            --border-glass: rgba(15, 23, 42, 0.09);
            --input-bg:     rgba(15, 23, 42, 0.03);
            --text-primary: #1b2140;
            --text-muted:   #5b6489;
            --accent-violet:#7c3aed;
            --accent-cyan:  #0891b2;
        }

        body {
            background-color: var(--bg-void);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color .4s ease, color .4s ease;
        }

        #bgCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        [data-bs-theme="light"] #bgCanvas { opacity: 0.22; }

        .form-container { position: relative; z-index: 10; padding-top: 110px; padding-bottom: 50px; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 3rem;
            color: var(--text-primary);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            animation: fadeUp .6s .1s both;
            transform-style: preserve-3d;
            perspective: 1200px;
            transition: box-shadow .3s;
            will-change: transform;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,92,246,.4), transparent);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-label { font-family: 'Sora', sans-serif; font-weight: 600; color: var(--text-muted); margin-bottom: 0.7rem; font-size: 0.85rem; }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-primary) !important;
            padding: 0.8rem 1.2rem;
            transition: 0.3s;
        }

        .form-control:focus {
            background: rgba(139, 92, 246, 0.06);
            border-color: var(--accent-violet);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .input-group-text {
            background: var(--input-bg) !important;
            border: 1px solid var(--border-glass) !important;
            color: var(--text-muted);
            border-radius: 12px 0 0 12px !important;
        }

        .btn-create {
            background: var(--accent-gradient);
            color: #090b14;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            box-shadow: 0 0 20px rgba(139,92,246,.3);
        }

        .btn-create:hover {
            box-shadow: 0 0 32px rgba(139,92,246,.55);
            transform: translateY(-3px);
            color: #090b14;
        }

        .step-indicator {
            display: flex; align-items: center; margin-bottom: 2rem;
            background: rgba(139, 92, 246, 0.1);
            padding: 10px 20px; border-radius: 50px; width: fit-content;
        }

        .step-indicator .badge {
            background: var(--accent-gradient) !important;
            color: #090b14;
        }

        .text-secondary { color: var(--text-muted) !important; }

        @media (prefers-reduced-motion: reduce) {
            .glass-card { animation: none !important; opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container form-container">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="glass-card tilt-card">
                <div class="step-indicator">
                    <span class="badge rounded-circle me-2">1</span>
                    <small class="fw-bold" style="color: var(--accent-cyan);">Step 1: Exam Details</small>
                </div>

                <h2 class="fw-bold mb-4" style="font-family:'Sora',sans-serif;">Create New <span style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Exam</span></h2>
                <p class="text-secondary mb-5">Fill in the basic details to initialize the exam session.</p>

                <form th:action="@{/admin/exam/add}" th:object="${exam}" method="post">
                    <div class="mb-4">
                        <label for="title" class="form-label">Exam Title</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-journal-text"></i>
                            </span>
                            <input type="text" class="form-control border-start-0" id="title" th:field="*{title}" placeholder="e.g. Java Fundamentals" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="duration" class="form-label">Duration (in minutes)</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-clock"></i>
                            </span>
                            <input type="number" class="form-control border-start-0" id="duration" th:field="*{durationInMinutes}" placeholder="60" required min="1">
                        </div>
                        <div class="form-text text-secondary small">Total time allowed for candidates.</div>
                    </div>

                    <button type="submit" class="btn btn-create">
                        Continue to Questions <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                    <div class="text-center mt-4">
                        <a th:href="@{/admin/dashboard}" class="text-secondary text-decoration-none small">
                            <i class="bi bi-x-circle me-1"></i> Cancel and return
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script th:inline="none">
(function () {
    const canvas = document.getElementById('bgCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    function isLightTheme() { return document.documentElement.getAttribute('data-bs-theme') === 'light'; }
    const DARK_BG = 0x090b14, LIGHT_BG = 0xf4f5fb;

    const scene = new THREE.Scene();
    renderer.setClearColor(isLightTheme() ? LIGHT_BG : DARK_BG, 1);
    scene.fog = new THREE.FogExp2(isLightTheme() ? LIGHT_BG : DARK_BG, 0.045);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 1, 20);
    function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    resize(); window.addEventListener('resize', resize);

    scene.add(new THREE.AmbientLight(0x140d40, 1.5));
    const pl1 = new THREE.PointLight(0x8b5cf6, 2.5, 40); pl1.position.set(-7,6,8); scene.add(pl1);
    const pl2 = new THREE.PointLight(0x22d3ee, 2, 30);   pl2.position.set(8,-4,6); scene.add(pl2);

    function mat(c,op=1){return new THREE.MeshStandardMaterial({color:c,metalness:.85,roughness:.15,transparent:op<1,opacity:op,emissive:c,emissiveIntensity:.1});}

    const rings=[];
    [[7,.028,0.2,0.0,0x22d3ee],[5.5,.035,0.65,0.9,0x8b5cf6],[4,.042,1.1,1.7,0xa78bfa]].forEach(([r,t,rx,ry,col])=>{
        const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,140),mat(col,.5)); m.rotation.x=rx; m.rotation.y=ry; scene.add(m); rings.push(m);
    });

    const floaters=[];
    [[new THREE.OctahedronGeometry(.24,0),0x22d3ee],[new THREE.TetrahedronGeometry(.2,0),0x8b5cf6],[new THREE.IcosahedronGeometry(.16,0),0x38bdf8],[new THREE.OctahedronGeometry(.18,0),0xa78bfa],[new THREE.TetrahedronGeometry(.26,0),0x22d3ee],[new THREE.OctahedronGeometry(.14,0),0x8b5cf6]].forEach(([geo,col])=>{
        const m=new THREE.Mesh(geo,mat(col,.6)); const a=Math.random()*Math.PI*2,rad=5+Math.random()*5;
        m.position.set(Math.cos(a)*rad,(Math.random()-.5)*8,Math.sin(a)*rad-5); m.userData={spd:.25+Math.random()*.35,offset:Math.random()*Math.PI*2,rad,a}; scene.add(m); floaters.push(m);
    });

    const ptPos=new Float32Array(1400*3); for(let i=0;i<ptPos.length;i++) ptPos[i]=(Math.random()-.5)*60;
    const ptGeo=new THREE.BufferGeometry(); ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
    scene.add(new THREE.Points(ptGeo,new THREE.PointsMaterial({color:0x22d3ee,size:.05,transparent:true,opacity:.35})));

    let mx=0,my=0,cx=0,cy=0,t=0;
    window.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth)*2-1; my=-((e.clientY/innerHeight)*2-1);});

    const themeObserver = new MutationObserver(() => {
        const light = isLightTheme();
        renderer.setClearColor(light ? LIGHT_BG : DARK_BG, 1);
        scene.fog.color.set(light ? LIGHT_BG : DARK_BG);
    });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    (function animate(){
        requestAnimationFrame(animate);
        if (reduceMotion) { renderer.render(scene, camera); return; }
        t+=.007;
        cx+=(mx*.15-cx)*.05; cy+=(my*.1-cy)*.05; camera.position.x=cx*2.5; camera.position.y=1+cy*1.5; camera.lookAt(0,0,0);
        rings[0].rotation.x+=.0025; rings[0].rotation.y+=.003;
        rings[1].rotation.x-=.003;  rings[1].rotation.z+=.002;
        rings[2].rotation.y+=.005;  rings[2].rotation.z-=.0025;
        pl1.position.x=Math.sin(t*.65)*8; pl1.position.y=Math.cos(t*.45)*5;
        pl2.position.x=Math.cos(t*.55)*7; pl2.position.y=Math.sin(t*.75)*4;
        floaters.forEach(f=>{const d=f.userData,na=d.a+t*d.spd*.1; f.position.x=Math.cos(na)*d.rad; f.position.z=Math.sin(na)*d.rad-5; f.position.y=Math.sin(t*d.spd+d.offset)*1.6; f.rotation.x+=.012; f.rotation.y+=.01;});
        renderer.render(scene,camera);
    })();
})();
</script>

<!-- 3D tilt-on-hover -->
<script th:inline="none">
(function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.tilt-card').forEach(card => {
        card.addEventListener('mousemove', e => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            card.style.transform = `perspective(1200px) rotateX(${(-y * 3).toFixed(2)}deg) rotateY(${(x * 3).toFixed(2)}deg)`;
        });
        card.addEventListener('mouseleave', () => { card.style.transform = 'perspective(1200px) rotateX(0) rotateY(0)'; });
    });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
