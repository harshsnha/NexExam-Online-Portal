<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Analytics - NexExam Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Flash prevention -->
    <script th:inline="none">
        (function () {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-void:      #090b14;
            --bg-surface:   #12162a;
            --glass:        rgba(18, 22, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-strong:rgba(139, 92, 246, 0.16);
            --text-primary: #eef0f9;
            --text-muted:   #9099b8;
            --accent-violet:#8b5cf6;
            --accent-cyan:  #22d3ee;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
            --pass: #34d399;
            --fail: #f87171;
        }

        [data-bs-theme="light"] {
            --bg-void:      #f4f5fb;
            --bg-surface:   #ffffff;
            --glass:        rgba(255, 255, 255, 0.8);
            --border-glass: rgba(15, 23, 42, 0.08);
            --border-strong:rgba(124, 58, 237, 0.22);
            --text-primary: #1b2140;
            --text-muted:   #5b6489;
            --accent-violet:#7c3aed;
            --accent-cyan:  #0891b2;
        }

        html, body {
            min-height: 100vh;
            background: var(--bg-void);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            transition: background .4s, color .4s;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            transition: opacity .5s;
        }
        [data-bs-theme="light"] #bgCanvas { opacity: 0.22; }

        .page-wrap {
            position: relative;
            z-index: 10;
            padding-top: 96px;
            padding-bottom: 60px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            animation: fadeUp .6s .1s both;
        }

        .header-icon {
            width: 56px; height: 56px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            color: #090b14;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(139,92,246,.4);
            position: relative;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        .header-icon::after {
            content: '';
            position: absolute; inset: -2px; border-radius: 18px;
            background: var(--accent-gradient);
            z-index: -1; filter: blur(10px); opacity: .35;
        }

        .page-title {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -.5px;
            margin-bottom: 3px;
        }

        .page-title span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-sub { color: var(--text-muted); font-size: .88rem; }

        .glass-panel {
            background: var(--glass);
            border: 1px solid var(--border-glass);
            border-radius: 22px;
            padding: 28px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            animation: fadeUp .6s .2s both;
            transition: background .4s, border-color .4s, box-shadow .35s ease;
            transform-style: preserve-3d;
            perspective: 1200px;
            will-change: transform;
            box-shadow: 0 20px 55px rgba(0,0,0,.35), 0 0 0 1px rgba(139,92,246,.06) inset;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,92,246,.55), rgba(34,211,238,.4), transparent);
        }

        /* Ambient glow orbs that drift slowly behind the panel for depth */
        .glass-panel::after {
            content: '';
            position: absolute;
            top: -30%; right: -10%;
            width: 55%; height: 90%;
            background: radial-gradient(circle, rgba(139,92,246,.10), transparent 65%);
            z-index: -1;
            pointer-events: none;
            animation: panelGlowDrift 8s ease-in-out infinite;
        }

        @keyframes panelGlowDrift {
            0%, 100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(-5%, 6%) scale(1.12); }
        }

        .glass-panel:hover {
            box-shadow: 0 30px 80px rgba(139,92,246,.28), 0 0 0 1px rgba(139,92,246,.12) inset;
        }

        .candidate-row-cell {
            transition: transform .25s cubic-bezier(.22,1,.36,1);
        }

        .analytics-table tbody tr:hover .candidate-row-cell {
            transform: translateZ(8px) translateX(2px);
        }

        .analytics-table {
            width: 100%;
            border-collapse: collapse;
        }

        .analytics-table thead th {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            padding: 0 16px 16px;
            border-bottom: 1px solid var(--border-glass);
            white-space: nowrap;
        }

        .analytics-table tbody td {
            padding: 15px 16px;
            border-bottom: 1px solid var(--border-glass);
            vertical-align: middle;
            color: var(--text-primary);
            font-size: .88rem;
        }

        .analytics-table tbody tr { transition: background .2s; }
        .analytics-table tbody tr:hover td { background: rgba(139,92,246,.04); }

        .candidate-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: .75rem; font-weight: 700;
            color: #090b14; flex-shrink: 0;
        }

        .raw-score {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-cyan);
        }

        .perf-pill {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: .78rem;
        }

        .pill-pass { background: rgba(52,211,153,.12); color: var(--pass); border: 1px solid rgba(52,211,153,.25); }
        .pill-fail { background: rgba(248,113,113,.12); color: var(--fail); border: 1px solid rgba(248,113,113,.25); }

        .status-text {
            display: block;
            margin-top: 6px;
            font-size: .66rem;
            font-weight: 700;
            letter-spacing: .8px;
        }
        .status-text.qualified { color: var(--pass); }
        .status-text.failed { color: var(--fail); }

        .time-badge {
            background: rgba(139,92,246,.1);
            color: var(--accent-violet);
            padding: 5px 12px;
            border-radius: 9px;
            font-weight: 700;
            font-size: .82rem;
            border: 1px solid rgba(139,92,246,.2);
        }

        /* ── Disqualified badge ── */
        .disqualified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .5px;
            background: rgba(248,113,113,.12);
            color: var(--fail);
            border: 1px solid rgba(248,113,113,.3);
            margin-top: 6px;
            cursor: help;
        }

        /* ── QR Button ── */
        .btn-qr {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-violet);
            border: 1px solid rgba(139, 92, 246, 0.22);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-qr:hover {
            background: var(--accent-gradient);
            color: #090b14;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
        }

        /* ── QR Modal — premium 3D credential card ── */
        .modal-content {
            background: var(--glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-strong);
            border-radius: 26px;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            animation: modalPop .4s cubic-bezier(.22,1,.36,1);
            box-shadow: 0 25px 70px rgba(139,92,246,.3), 0 0 0 1px rgba(139,92,246,.08) inset;
        }

        /* Glowing gradient border ring around the whole card */
        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 1.5px;
            border-radius: 26px;
            background: var(--accent-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: .55;
            pointer-events: none;
        }

        /* Soft ambient glow drifting behind the card */
        .modal-content::after {
            content: '';
            position: absolute;
            top: -40%; left: -20%;
            width: 140%; height: 140%;
            background: radial-gradient(circle, rgba(139,92,246,.16), transparent 60%);
            z-index: -1;
            animation: driftGlow 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes driftGlow {
            0%, 100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(6%, 4%) scale(1.08); }
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(.82) translateY(36px) rotateX(-8deg); }
            to   { opacity: 1; transform: scale(1) translateY(0) rotateX(0); }
        }

        .credential-icon {
            width: 58px; height: 58px;
            margin: 0 auto 14px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            color: #090b14;
            position: relative;
            box-shadow: 0 0 26px rgba(139,92,246,.55);
            animation: floatIcon 3s ease-in-out infinite;
        }

        .credential-icon::after {
            content: '';
            position: absolute; inset: -3px;
            border-radius: 19px;
            background: var(--accent-gradient);
            z-index: -1; filter: blur(12px); opacity: .5;
        }

        .qr-frame {
            background: #ffffff;
            padding: 16px;
            border-radius: 20px;
            display: inline-block;
            position: relative;
            box-shadow: 0 12px 36px rgba(139,92,246,.3);
            transition: transform .3s cubic-bezier(.22,1,.36,1);
            transform-style: preserve-3d;
            animation: qrPulse 2.4s ease-in-out infinite;
        }

        .qr-frame::before {
            content: '';
            position: absolute; inset: -3px;
            border-radius: 22px;
            background: var(--accent-gradient);
            z-index: -1;
            opacity: .7;
        }

        .qr-frame:hover {
            transform: perspective(600px) rotateX(4deg) rotateY(-4deg) scale(1.03);
        }

        .qr-frame img { display: block; border-radius: 6px; }

        @keyframes qrPulse {
            0%, 100% { box-shadow: 0 12px 36px rgba(139,92,246,.22); }
            50%      { box-shadow: 0 12px 46px rgba(34,211,238,.35); }
        }

        .credential-id-badge {
            display: inline-block;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: .5px;
            padding: 8px 20px;
            border: 1px solid var(--border-strong);
            border-radius: 50px;
            background-color: rgba(139,92,246,.08);
        }

        .btn-return {
            display: inline-flex !important;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            color: var(--text-primary) !important;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: .88rem;
            text-decoration: none !important;
            transition: all 0.2s;
            backdrop-filter: blur(12px);
            cursor: pointer;
            position: relative;
            z-index: 20;
        }

        .btn-return:hover {
            background: var(--accent-gradient) !important;
            border-color: transparent !important;
            color: #090b14 !important;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(139,92,246,.45);
        }

        .btn-return:hover i { color: #090b14 !important; }

        .btn-modal-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--glass);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: .88rem;
            margin-top: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal-close:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #090b14;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(139,92,246,.45);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .page-header, .glass-panel, .header-icon { animation: none !important; opacity: 1 !important; transform: none !important; }
            .glass-panel:hover { transform: none !important; }
            .glass-panel::after { animation: none !important; }
            .candidate-row-cell, .analytics-table tbody tr:hover .candidate-row-cell { transform: none !important; }
            .qr-frame, .modal-content, .modal-content::after, .credential-icon { animation: none !important; }
            .qr-frame:hover { transform: none !important; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div th:replace="~{navbar :: navbar}"></div>

<main class="container page-wrap">

    <div class="page-header">
        <div class="header-icon"><i class="bi bi-trophy-fill"></i></div>
        <div>
            <h2 class="page-title">Exam <span>Analytics</span></h2>
            <p class="page-sub" th:text="${exam.title}">Exam Results</p>
        </div>
    </div>

    <div class="glass-panel tilt-card">
        <div th:if="${#lists.isEmpty(results)}" class="empty-state text-center py-5">
            <i class="bi bi-clipboard-x mb-3 d-block" style="font-size: 3rem; opacity: 0.5;"></i>
            <h5>No submissions recorded yet.</h5>
        </div>

        <div th:unless="${#lists.isEmpty(results)}" class="table-responsive">
            <table class="analytics-table">
                <thead>
                    <tr>
                        <th>Candidate</th>
                        <th>Score</th>
                        <th>Performance</th>
                        <th class="text-center">Time</th>
                        <th>Verification</th>
                        <th class="text-end">Submitted</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="result : ${results}">
                        <td class="candidate-row-cell">
                            <div class="d-flex align-items-center gap-3">
                                <div class="candidate-avatar" th:text="${#strings.substring(result.student.fullName, 0, 1)}">R</div>
                                <div>
                                    <div class="candidate-name" th:text="${result.student.fullName}">Student Name</div>
                                    <div class="candidate-email" style="color:var(--text-muted); font-size:.78rem;" th:text="${result.student.username}">email@example.com</div>
                                    <span th:if="${result.disqualified}" class="disqualified-badge" th:title="${result.disqualifyReason}">
                                        <i class="bi bi-exclamation-triangle-fill"></i> DISQUALIFIED
                                    </span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="raw-score" th:text="${result.scoreAchieved}">0</span>
                            <span style="color: var(--text-muted); margin: 0 4px;">/</span>
                            <span th:text="${result.totalMarks}">0</span>
                        </td>
                        <td>
                            <th:block th:if="${result.totalMarks > 0}" th:with="pct=${(result.scoreAchieved * 100.0) / result.totalMarks}">
                                <span class="perf-pill" th:classappend="${pct >= 50 ? 'pill-pass' : 'pill-fail'}" th:text="${#numbers.formatDecimal(pct, 1, 1) + '%'}"></span>
                                <span class="status-text" th:classappend="${pct >= 30 ? 'qualified' : 'failed'}" th:text="${pct >= 30 ? 'QUALIFIED' : 'FAILED'}"></span>
                            </th:block>
                        </td>
                        <td class="text-center">
                            <span class="time-badge" th:text="${result.timeTaken != null ? result.timeTaken : '—'}">05:20</span>
                        </td>

                        <!-- QR Verification Button -->
                        <td>
                            <button class="btn btn-qr" data-bs-toggle="modal" th:data-bs-target="'#qrModal' + ${result.id}">
                                <i class="bi bi-qr-code-scan me-1"></i> Verify
                            </button>

                            <!-- QR Modal per Student -->
                            <div class="modal fade" th:id="'qrModal' + ${result.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-body text-center p-5">
                                            <th:block th:with="sNum='NEX-' + ${result.submissionTime.year} + '-' + ${1000 + result.id}">
                                                <div class="credential-icon"><i class="bi bi-patch-check-fill"></i></div>
                                                <h5 class="mb-4" style="font-family: 'Sora', sans-serif; font-weight: 800;">Digital Credential</h5>
                                                <div class="qr-frame mb-4">
                                                    <!-- Dynamic QR generating URL for VerificationController -->
                                                    <!-- FIX: hardcoded localhost hata ke Controller se aaya verifyBaseUrl use kiya -->
                                                    <img th:src="'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + ${verifyBaseUrl} + ${sNum}" alt="QR">
                                                </div>
                                                <div class="credential-id-badge mb-3" th:text="${sNum}"></div>
                                                <p class="small" style="color:var(--text-muted);">Scan this code to verify authenticity of <br><strong style="color:var(--text-primary);" th:text="${result.student.fullName}"></strong>'s result.</p>
                                                <button type="button" class="btn-modal-close manual-close-btn" data-bs-dismiss="modal">Close</button>
                                            </th:block>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>

                        <td class="text-end">
                            <div style="font-size: .85rem; font-weight: 500;" th:text="${#temporals.format(result.submissionTime, 'dd-MMM-yyyy')}">Date</div>
                            <div style="font-size: .72rem; color: var(--text-muted);" th:text="${#temporals.format(result.submissionTime, 'HH:mm')}">Time</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin/manage-exams}" class="btn-return"><i class="bi bi-arrow-left"></i> Back to Exams</a>
    </div>
</main>

<!-- Three.js Background Script -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script th:inline="none">
    (function () {
        const canvas = document.getElementById('bgCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

        function isLightTheme() { return document.documentElement.getAttribute('data-bs-theme') === 'light'; }
        const DARK_BG = 0x090b14, LIGHT_BG = 0xf4f5fb;

        const scene = new THREE.Scene();
        renderer.setClearColor(isLightTheme() ? LIGHT_BG : DARK_BG, 1);
        scene.fog = new THREE.FogExp2(isLightTheme() ? LIGHT_BG : DARK_BG, 0.038);

        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(0, 2, 24);
        function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
        resize(); window.addEventListener('resize', resize);

        scene.add(new THREE.AmbientLight(0x140d40, 1.4));
        const pl1 = new THREE.PointLight(0x8b5cf6, 2.5, 45); pl1.position.set(-8, 8, 10); scene.add(pl1);
        const pl2 = new THREE.PointLight(0x22d3ee, 2, 35);   pl2.position.set(10, -5, 8); scene.add(pl2);

        function mat(c, op = 1) { return new THREE.MeshStandardMaterial({ color: c, metalness: .85, roughness: .15, transparent: op < 1, opacity: op, emissive: c, emissiveIntensity: .1 }); }

        const rings = [];
        [[8,.03,0.25,0.0,0x22d3ee],[6.5,.038,0.7,0.9,0x8b5cf6],[5,.045,1.2,1.8,0x38bdf8],[3.5,.052,0.5,2.6,0xa78bfa]].forEach(([r,t,rx,ry,col]) => {
            const m = new THREE.Mesh(new THREE.TorusGeometry(r,t,8,140), mat(col,.6)); m.rotation.x=rx; m.rotation.y=ry; scene.add(m); rings.push(m);
        });

        // Analytics signature — a grid of small "bar chart" cubes
        const barGroup = new THREE.Group();
        const barHeights = [0.6, 1.2, 0.8, 1.6, 1.0, 0.5];
        barHeights.forEach((h, i) => {
            const geo = new THREE.BoxGeometry(0.3, h, 0.3);
            const col = i % 2 === 0 ? 0x8b5cf6 : 0x22d3ee;
            const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, metalness: .9, roughness: .1, emissive: col, emissiveIntensity: .3, transparent: true, opacity: .85 }));
            m.position.x = (i - (barHeights.length - 1) / 2) * 0.45;
            m.position.y = h / 2 - 0.8;
            barGroup.add(m);
        });
        scene.add(barGroup);

        const icoGeo = new THREE.IcosahedronGeometry(1.1, 0);
        const ico = new THREE.Mesh(icoGeo, new THREE.MeshBasicMaterial({ color:0x22d3ee, wireframe:true, transparent:true, opacity:.12 })); scene.add(ico);

        const floaters = [];
        [[new THREE.OctahedronGeometry(.28,0),0x22d3ee],[new THREE.TetrahedronGeometry(.22,0),0x8b5cf6],[new THREE.IcosahedronGeometry(.18,0),0x38bdf8],[new THREE.OctahedronGeometry(.20,0),0xa78bfa],[new THREE.TetrahedronGeometry(.30,0),0x22d3ee],[new THREE.OctahedronGeometry(.15,0),0x8b5cf6],[new THREE.IcosahedronGeometry(.25,0),0x22d3ee],[new THREE.TetrahedronGeometry(.18,0),0x38bdf8],[new THREE.OctahedronGeometry(.22,0),0xa78bfa],[new THREE.TetrahedronGeometry(.26,0),0x8b5cf6]].forEach(([geo,col]) => {
            const m = new THREE.Mesh(geo, mat(col,.65)); const a=Math.random()*Math.PI*2, rad=6+Math.random()*6;
            m.position.set(Math.cos(a)*rad,(Math.random()-.5)*10,Math.sin(a)*rad-5); m.userData={spd:.25+Math.random()*.35,offset:Math.random()*Math.PI*2,rad,a}; scene.add(m); floaters.push(m);
        });

        const ptPos = new Float32Array(2000*3); for(let i=0;i<ptPos.length;i++) ptPos[i]=(Math.random()-.5)*70;
        const ptGeo = new THREE.BufferGeometry(); ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
        const stars = new THREE.Points(ptGeo, new THREE.PointsMaterial({color:0x22d3ee,size:.055,transparent:true,opacity:.4})); scene.add(stars);

        const grid = new THREE.GridHelper(80,35,0x1a1040,0x1a1040); grid.position.y=-12; grid.material.transparent=true; grid.material.opacity=.28; scene.add(grid);

        let mx=0,my=0,cx=0,cy=0,t=0;
        window.addEventListener('mousemove', e => { mx=(e.clientX/innerWidth)*2-1; my=-((e.clientY/innerHeight)*2-1); });

        const themeObserver = new MutationObserver(() => {
            const light = isLightTheme();
            renderer.setClearColor(light ? LIGHT_BG : DARK_BG, 1);
            scene.fog.color.set(light ? LIGHT_BG : DARK_BG);
        });
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        (function animate(){
            requestAnimationFrame(animate);
            if (reduceMotion) { renderer.render(scene, camera); return; }
            t+=.007;
            cx+=(mx*.2-cx)*.05; cy+=(my*.15-cy)*.05; camera.position.x=cx*3.5; camera.position.y=2+cy*2; camera.lookAt(0,0,0);
            rings[0].rotation.x+=.0025; rings[0].rotation.y+=.003;
            rings[1].rotation.x-=.003;  rings[1].rotation.z+=.002;
            rings[2].rotation.y+=.005;  rings[2].rotation.z-=.0025;
            rings[3].rotation.x+=.004;  rings[3].rotation.y-=.0035;
            barGroup.rotation.y += .006;
            barGroup.position.y = Math.sin(t * 1.4) * .2;
            ico.rotation.x += .003; ico.rotation.y += .004;
            pl1.position.x=Math.sin(t*.65)*9; pl1.position.y=Math.cos(t*.45)*6; pl2.position.x=Math.cos(t*.55)*8; pl2.position.y=Math.sin(t*.75)*5;
            floaters.forEach(f=>{const d=f.userData,na=d.a+t*d.spd*.1; f.position.x=Math.cos(na)*d.rad; f.position.z=Math.sin(na)*d.rad-5; f.position.y=Math.sin(t*d.spd+d.offset)*2; f.rotation.x+=.013; f.rotation.y+=.011;});
            stars.rotation.y+=.00025; renderer.render(scene,camera);
        })();
    })();
</script>

<!-- 3D tilt-on-hover -->
<script th:inline="none">
(function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.tilt-card').forEach(card => {
        card.addEventListener('mousemove', e => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            card.style.transform = `perspective(900px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg) translateY(-3px)`;
        });
        card.addEventListener('mouseleave', () => { card.style.transform = 'perspective(900px) rotateX(0) rotateY(0) translateY(0)'; });
    });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Fix: sometimes Bootstrap leaves a stray modal-backdrop / body class behind
     after a modal closes, which silently blocks clicks on elements below it
     (like "Back to Exams"). This forces cleanup whenever any modal finishes closing. -->
<script th:inline="none">
(function () {
    document.addEventListener('hidden.bs.modal', function () {
        document.querySelectorAll('.modal-backdrop').forEach(function (el) { el.remove(); });
        document.body.classList.remove('modal-open');
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('padding-right');
    });

    // Belt-and-suspenders: manually close the modal on Close-button click,
    // in case data-bs-dismiss doesn't fire for any reason (e.g. a JS/CDN hiccup).
    document.querySelectorAll('.manual-close-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var modalEl = btn.closest('.modal');
            if (!modalEl) return;
            if (window.bootstrap && window.bootstrap.Modal) {
                var instance = window.bootstrap.Modal.getOrCreateInstance(modalEl);
                instance.hide();
            }
            // Fallback: force-hide even if the Bootstrap instance/animation gets stuck.
            setTimeout(function () {
                modalEl.classList.remove('show');
                modalEl.style.display = 'none';
                modalEl.setAttribute('aria-hidden', 'true');
                document.querySelectorAll('.modal-backdrop').forEach(function (el) { el.remove(); });
                document.body.classList.remove('modal-open');
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('padding-right');
            }, 350);
        });
    });

    // CRITICAL FIX: .glass-panel uses `will-change: transform` + `perspective`
    // for the 3D tilt effect. Any ancestor with those properties becomes the
    // "containing block" for descendant position:fixed elements (like Bootstrap
    // modals). Since these QR modals are nested inside .glass-panel in the DOM,
    // they get trapped/clipped inside that box instead of the viewport — which
    // breaks their position AND makes clicks (like Close) land in the wrong place.
    // Fix: move every modal to be a direct child of <body> on page load.
    document.querySelectorAll('.modal').forEach(function (modalEl) {
        document.body.appendChild(modalEl);
    });
})();
</script>
