<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <style th:fragment="navbar-style">
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-void: #090b14;
            --bg-surface: #12162a;
            --bg-elevated: #1b2140;
            --nav-bg: rgba(9, 11, 20, 0.72);
            --text-primary: #eef0f9;
            --text-muted: #9099b8;
            --accent-violet: #8b5cf6;
            --accent-cyan: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
            --border-glass: rgba(255, 255, 255, 0.09);
            --dropdown-bg: rgba(18, 22, 42, 0.97);
            --danger: #f87171;
            --card-bg: #12162a;
        }

        [data-bs-theme="light"] {
            --bg-void: #f4f5fb;
            --bg-surface: #ffffff;
            --bg-elevated: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.75);
            --text-primary: #1b2140;
            --text-muted: #5b6489;
            --accent-violet: #7c3aed;
            --accent-cyan: #0891b2;
            --border-glass: rgba(15, 23, 42, 0.09);
            --dropdown-bg: rgba(255, 255, 255, 0.97);
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-void) !important;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: background-color .45s ease, color .45s ease;
        }

        /* ===== Navbar shell ===== */
        .navbar-glass {
            background: var(--nav-bg) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1100;
            padding: 0.7rem 0;
            animation: navDrop .6s cubic-bezier(.22,1,.36,1);
        }

        @keyframes navDrop {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* ===== Brand + signature orbit ===== */
        .navbar-brand {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -.02em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: .55rem;
        }

        .brand-orbit {
            position: relative;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-orbit::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-violet), var(--accent-cyan), var(--accent-violet));
            animation: spin 4s linear infinite;
            filter: blur(1px);
        }

        .brand-orbit::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--bg-void);
        }

        .brand-orbit i {
            position: relative;
            z-index: 2;
            font-size: .8rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Nav links: 3D tilt on hover ===== */
        .nav-link {
            font-weight: 500;
            color: var(--text-muted) !important;
            border-radius: 10px;
            margin: 0 3px;
            padding: .5rem .9rem !important;
            transform-style: preserve-3d;
            perspective: 400px;
            transition: color .25s ease, background .25s ease, transform .25s ease;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
            background: rgba(139, 92, 246, 0.12);
            transform: translateY(-2px) rotateX(6deg);
        }

        .nav-link.active-glow {
            color: var(--text-primary) !important;
            box-shadow: inset 0 -2px 0 var(--accent-cyan);
        }

        /* ===== Actions dropdown ===== */
        .action-btn {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        .dropdown-menu {
            background: var(--dropdown-bg);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: .5rem;
            margin-top: 12px !important;
            box-shadow: 0 20px 45px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.02);
            transform-origin: top center;
            animation: dropIn .22s cubic-bezier(.22,1,.36,1);
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-8px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .dropdown-item {
            color: var(--text-primary) !important;
            border-radius: 9px;
            padding: .6rem .9rem;
            font-weight: 500;
            font-size: .92rem;
            transition: transform .18s ease, background .18s ease, padding-left .18s ease;
        }

        .dropdown-item:hover {
            background: rgba(139, 92, 246, 0.14) !important;
            transform: translateX(3px);
        }

        .dropdown-item i { transition: transform .25s ease; }
        .dropdown-item:hover i { transform: scale(1.15) rotate(-6deg); }

        /* ===== Theme toggle ===== */
        .theme-toggle-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
        }

        .theme-toggle-btn:hover {
            transform: rotate(25deg) scale(1.08);
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.4);
        }

        .theme-toggle-btn i { transition: transform .35s ease; }

        /* ===== Profile ===== */
        .navbar-profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: var(--accent-gradient) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
            transition: transform .3s ease;
        }

        a:hover .navbar-profile-pic { transform: scale(1.06); }

        .role-indicator {
            font-family: 'Inter', sans-serif;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            background: rgba(34, 211, 238, 0.14);
            color: var(--accent-cyan);
            padding: 2px 9px;
            border-radius: 20px;
        }

        .btn-logout-nav {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger) !important;
            border: 1px solid rgba(248, 113, 113, 0.25);
            font-weight: 700;
            font-size: .88rem;
            padding: 7px 16px;
            border-radius: 50px;
            transition: all .3s ease;
        }

        .btn-logout-nav:hover {
            background: var(--danger);
            color: #fff !important;
            box-shadow: 0 6px 16px rgba(248, 113, 113, 0.35);
            transform: translateY(-1px);
        }

        /* ===== Mobile collapse panel — proper stacked layout ===== */
        @media (max-width: 991.98px) {
            #navbarSupportedContent {
                background: var(--dropdown-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--border-glass);
                border-radius: 16px;
                margin-top: 12px;
                padding: 14px;
                box-shadow: 0 20px 45px rgba(0,0,0,.35);
            }

            #navbarSupportedContent .navbar-nav {
                flex-direction: column;
                align-items: stretch !important;
                width: 100%;
            }

            #navbarSupportedContent .nav-link {
                width: 100%;
                margin: 2px 0 !important;
            }

            .action-dropdown .dropdown-menu {
                position: static !important;
                width: 100%;
                box-shadow: none;
                margin-top: 6px !important;
                background: rgba(255,255,255,.03);
            }

            #navbarSupportedContent .navbar-nav.ms-auto {
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid var(--border-glass);
                gap: 10px;
            }

            #navbarSupportedContent .navbar-nav.ms-auto > li {
                width: 100%;
                margin: 0 !important;
            }

            /* Theme toggle centered on its own row */
            #navbarSupportedContent .theme-toggle-btn {
                margin: 0 auto;
            }

            /* Profile block + logout stacked, full width */
            #navbarSupportedContent li[sec\:authorize="isAuthenticated()"] {
                display: flex !important;
                flex-direction: column;
                align-items: stretch !important;
                gap: 10px;
            }

            #navbarSupportedContent li[sec\:authorize="isAuthenticated()"] > a {
                margin: 0 !important;
                border: none !important;
                border-bottom: 1px solid var(--border-glass) !important;
                padding-bottom: 10px !important;
                justify-content: center;
            }

            .btn-logout-nav {
                width: 100%;
                justify-content: center;
            }

            .navbar-profile-pic { width: 32px; height: 32px; }
        }
    </style>
</head>

        a:hover .navbar-profile-pic{transform:scale(1.06)}
        .role-indicator{font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(34,211,238,.14);color:var(--accent-cyan);padding:2px 9px;border-radius:20px}
        .btn-logout-nav{background:rgba(248,113,113,.1);color:var(--danger) !important;border:1px solid rgba(248,113,113,.25);font-weight:700;font-size:.88rem;padding:7px 16px;border-radius:50px;transition:all .3s ease}

    <div class="container">

            NexExam

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Home</a></li>

                <th:block sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item dropdown action-dropdown mx-1">
                        <a class="nav-link action-btn dropdown-toggle rounded-pill px-3" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-lightning-charge-fill me-1"></i> Actions
                        </a>
                        <ul class="dropdown-menu border-0 shadow">
                            <li><a class="dropdown-item" th:href="@{/admin/exam/add}"><i class="bi bi-plus-circle me-2 text-info"></i> New Exam</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/manage-exams}"><i class="bi bi-pencil-square me-2 text-warning"></i> Manage Exams</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/students}"><i class="bi bi-people-fill me-2 text-success"></i> Manage Students</a></li>

                    <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Toggle dark/light theme">

                    <a class="nav-link px-3 rounded-pill border border-info border-opacity-25" th:href="@{/login}">Login</a>

    <script>
        (function () {
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const html = document.documentElement;

            function updateUI(theme) {
                if (theme === 'light') {
                    icon.classList.remove('bi-moon-stars-fill');
                    icon.classList.add('bi-sun-fill');
                    icon.style.color = '#f59e0b';
                } else {
                    icon.classList.remove('bi-sun-fill');
                    icon.classList.add('bi-moon-stars-fill');
                    icon.style.color = '#22d3ee';
                }
            }

            // Body background/color is now handled by each page's own
            // "html, body { background: var(--bg-void) !important; }" CSS rule,
            // which reacts automatically to the data-bs-theme attribute below.
            // We only toggle that attribute here — no inline JS painting needed,
            // and none should be added, since an inline !important background
            // would sit on top of (and visually match/mask) any Three.js canvas
            // that also clears to the theme's background color.
            const savedTheme = localStorage.getItem('theme') || 'dark';
            html.setAttribute('data-bs-theme', savedTheme);
            updateUI(savedTheme);

            toggle.addEventListener('click', () => {
                const current = html.getAttribute('data-bs-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-bs-theme', next);
                localStorage.setItem('theme', next);
                updateUI(next);
            });
        })();
    </script>

</body>
