spring.application.name=NexExam
server.port=${PORT:8081}

# ── Database ──
# Locally (VS Code), no environment variables are set, so these defaults kick in
# and everything behaves EXACTLY as before (H2 file database).
# On Railway, we will set the SPRING_DATASOURCE_* environment variables, and
# this same file automatically switches to PostgreSQL — no code change needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/examdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# --- H2 Console ---
# Enable H2 console to view your database in the browser
# Access it at: http://localhost:8081/h2-console
# IMPORTANT: When logging in, you MUST change the JDBC URL to: jdbc:h2:file:./data/examdb
# On Railway we will set H2_CONSOLE_ENABLED=false (H2 console has no place in production).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# JPA Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

file.upload-dir=${FILE_UPLOAD_DIR:./uploads/}